version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cognivoice-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: cognivoice_saas
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: cognivoice-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cognivoice-api
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/cognivoice_saas
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_change_in_production_9f81a7b
      - JWT_REFRESH_SECRET=super_secret_refresh_jwt_key_change_in_production_88b2
    depends_on:
      - mongodb
      - redis

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cognivoice-worker
    restart: always
    command: ['node', 'dist/workers/index.js']
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/cognivoice_saas
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

volumes:
  mongodb_data:
  redis_data:
